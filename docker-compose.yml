services:
  neo4j:
    image: neo4j:5
    container_name: nexus-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/nexusdemo123
    volumes:
      - nexus_neo4j_data:/data
      - nexus_neo4j_logs:/logs

volumes:
  nexus_neo4j_data:
  nexus_neo4j_logs:
